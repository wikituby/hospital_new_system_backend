# Activate with: quarkus.profile=lan   (or QUARKUS_PROFILE=lan alongside your usual profile)
# Enables HTTPS :8443 so https://venerandahospital.org can call this clinic from every LAN PC.
quarkus.http.ssl-port=8443
quarkus.http.insecure-requests=enabled
quarkus.http.ssl.certificate.key-store-file=certs/clinic-server.p12
quarkus.http.ssl.certificate.key-store-password=${LAN_KEYSTORE_PASSWORD}
quarkus.http.ssl.certificate.key-store-file-type=PKCS12